# Ablation benchmark (Option A, corrected): static vs auction-only vs auction+guided, to decompose
# how much of the advantage is generic reallocation vs the added probability guidance.
# No magic numbers in src/. Survivors are SPARSE (a few hotspots) — not one in every cell.

grid: { rows: 8, cols: 8 }
cell_size_m: 200
hotspots: [[6, 6], [1, 6], [6, 1]]   # 3 survivor hotspots in different sectors, far from the NW base
cluster_sigma: 1.0                    # tight hotspots -> most cells are empty (realistic)
survivors_total: 80
prior_noise: 0.35                     # the guided system's prior is informative-but-imperfect
person_fn: 0.1
n_uavs: 4
condition: one_fail
n_seeds: 30
duration_min: 90
fail_window_s: [20.0, 120.0]
