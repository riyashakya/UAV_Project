# SAHI at a realistic operating point (make sahi-recall). Recall/precision, full-frame vs tiled,
# base vs fine-tuned — the SAR-relevant view that the conf=0.001 AP in eval.yaml misses.

base_weights: outputs/perception/detect_yolo11s_20260719_181538/weights/best.pt      # whole-image trained
finetuned_weights: outputs/perception/detect_best_20260805_041241/weights/best.pt    # tile-fine-tuned

val_images: data/unified/detect/images/val
val_labels: data/unified/detect/labels/val

conf: 0.25          # realistic operating threshold (not 0.001) — this is the key point
iou_match: 0.5      # standard localisation threshold for a hit
imgsz: 640
slice: 640          # SAHI slice size
overlap: 0.2        # SAHI slice overlap

sample: { visdrone: 60, sard: 40 }   # balanced subset (visdrone has the small objects)
